services:
  web:
    build: 
      context: .          
      dockerfile: Dockerfile 
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles 
      - media_volume:/app/media        
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=jobit.settings       
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - SECRET_KEY=django-insecure-demo-key-for-thesis
      
      - OPENAI_API_KEY=
      - AZURE_STORAGE_CONNECTION_STRING=
      - EMAIL_HOST_PASSWORD=
      
      - USE_LOCAL_STORAGE=True
      
    command: >
      sh -c "echo '🚀 Starting Job.it application...' &&
             echo '📁 Creating migration directories...' &&
             mkdir -p users/migrations jobs/migrations applications/migrations chat/migrations matching/migrations &&
             touch users/migrations/__init__.py jobs/migrations/__init__.py applications/migrations/__init__.py chat/migrations/__init__.py matching/migrations/__init__.py &&
             echo '🔧 Generating initial migrations...' &&
             python manage.py makemigrations &&
             echo '⏳ Running database migrations...' &&
             python manage.py migrate &&
             echo '📚 Initializing skills...' &&
             python manage.py init_skills &&
             echo '🎯 Generating sample data...' &&
             python manage.py generate_sample_data --job-count 25 --user-count 5 &&
             echo '📁 Collecting static files...' &&
             python manage.py collectstatic --noinput &&
             echo '🌐 Starting Django server...' &&
             python manage.py runserver 0.0.0.0:8000"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s       
      retries: 3         
      start_period: 40s  

volumes:
  static_volume:
    driver: local
  
  media_volume:
    driver: local